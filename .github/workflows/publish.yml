name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish munim-ffmpeg
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install current npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v$(node -p \"require('./packages/munim-ffmpeg/package.json').version\")"

      - name: Generate Nitro bindings
        run: npm run codegen

      - name: Verify generated bindings are committed
        run: git diff --exit-code -- packages/munim-ffmpeg/nitrogen/generated

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: packages/munim-ffmpeg

      - name: Check npm registry
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "munim-ffmpeg@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: packages/munim-ffmpeg

      - name: Publish with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
        working-directory: packages/munim-ffmpeg
