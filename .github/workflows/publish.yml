name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish munim-ffmpeg
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install current npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Generate Nitro bindings
        run: npm run codegen

      - name: Verify generated bindings are committed
        run: git diff --exit-code -- packages/munim-ffmpeg/nitrogen/generated

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: packages/munim-ffmpeg

      - name: Publish with provenance
        run: npm publish --access public --provenance
        working-directory: packages/munim-ffmpeg
