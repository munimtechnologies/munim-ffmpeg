name: Build Android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "package.json"
      - "package-lock.json"
      - "example/**"
      - "packages/munim-ffmpeg/android/**"
      - "packages/munim-ffmpeg/nitrogen/generated/android/**"
      - "packages/munim-ffmpeg/nitrogen/generated/shared/**"
      - "packages/munim-ffmpeg/src/**"
      - "packages/munim-ffmpeg/nitro.json"
      - "packages/munim-ffmpeg/react-native.config.js"
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "package.json"
      - "package-lock.json"
      - "example/**"
      - "packages/munim-ffmpeg/android/**"
      - "packages/munim-ffmpeg/nitrogen/generated/android/**"
      - "packages/munim-ffmpeg/nitrogen/generated/shared/**"
      - "packages/munim-ffmpeg/src/**"
      - "packages/munim-ffmpeg/nitro.json"
      - "packages/munim-ffmpeg/react-native.config.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: example

      - name: Build debug app
        run: ./gradlew assembleDebug --no-daemon --build-cache
        working-directory: example/android
